<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scopus AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='10.5' cy='10.5' r='6.5' fill='none' stroke='%233b6fd8' stroke-width='2.5'/%3E%3Cpath d='m15.5 15.5 5 5' stroke='%233b6fd8' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Chat history">
      <div class="side-top">
        <div class="brand">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
          <span>Scopus AI</span>
        </div>
        <button class="icon-btn mobile-only" id="close-sidebar" type="button" aria-label="Close sidebar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <button class="new-chat" id="new-chat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>
        <input id="search" type="search" placeholder="Search chats" autocomplete="off">
      </label>

      <nav class="conv-list" id="conv-list"></nav>

      <div class="side-bottom">
        <div class="index-info" id="index-info">Loading index…</div>
        <a class="side-link" id="embed-link" href="#" target="_blank" rel="noopener">Embedding service ↗</a>
        <button class="side-link danger" id="clear-all" type="button">Clear all history</button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="open-sidebar" type="button" aria-label="Open chat history">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 id="chat-title">New chat</h1>
        <button class="icon-btn" id="export-btn" type="button" title="Export chat as Markdown" aria-label="Export chat as Markdown" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>
        </button>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a research question…" aria-label="Question"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
          </button>
        </form>
        <p class="disclaimer">Answers are generated from the local paper database and can contain mistakes. Check the cited papers.</p>
      </footer>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
